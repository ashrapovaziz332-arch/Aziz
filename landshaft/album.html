.2" fill="none" stroke="#1d1d1b" stroke-width="0.35"/><line x1="214" y1="26" x2="214" y2="90.2" stroke-width="0.15" stroke="#1d1d1b"/><line x1="314" y1="26" x2="314" y2="90.2" stroke-width="0.15" stroke="#1d1d1b"/><line x1="328" y1="26" x2="328" y2="90.2" stroke-width="0.15" stroke="#1d1d1b"/><line x1="350" y1="26" x2="350" y2="90.2" stroke-width="0.15" stroke="#1d1d1b"/></g><g ><text x="205" y="100.2" font-size="3.4" text-anchor="start" font-weight="bold" fill="#1d1d1b">Umumiy izohlar</text><text x="205" y="105.2" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">1. Loyiha buyurtmachining texnik topshirig&#x27;i, uchastkaning geodezik s&#x27;yomkasi (M 1:200) va</text><text x="209" y="108.8" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">joyni ko&#x27;zdan kechirish natijalari asosida ishlab chiqilgan.</text><text x="205" y="113.2" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">2. Balandliklar Boltiq tizimida. Uyning toza pol sathi ±0,000 = 450,90 absolyut belgiga teng.</text><text x="205" y="117.6" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">3. O&#x27;lchamlar metrda, konstruktiv tugunlar millimetrda ko&#x27;rsatilgan.</text><text x="205" y="122" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">4. Iqlim: keskin kontinental; yozgi harorat +42 °C gacha, qishki −15 °C gacha. Assortiment shu</text><text x="209" y="125.6" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">sharoitga chidamli turlardan tanlangan.</text><text x="205" y="130" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">5. Tuproq — lyossimon qumoq, sizot suvlari 4 m dan chuqur. Ekish joylariga unumdor tuproq</text><text x="209" y="133.6" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">aralashmasi keltiriladi (tuproq:torf:qum = 2:1:1).</text><text x="205" y="138" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">6. Barcha yer osti tarmoqlari (gaz, suv, kanalizatsiya, kabel) ish boshlanishidan oldin joyida</text><text x="209" y="141.6" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">aniqlanib, belgilanadi. Tarmoqlardan 1,5 m radiusda faqat qo&#x27;lda qaziladi.</text><text x="205" y="146" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">7. Ishlar QMQ 3.07.01, QMQ 2.07.01 va mehnat xavfsizligi qoidalariga muvofiq bajariladi.</text><text x="205" y="150.4" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">8. Ishlarni bajarish ketma-ketligi: tayyorlov → yer ishlari → tarmoqlar → qoplamalar → KMSh →</text><text x="209" y="154" font-size="2.5" text-anchor="start" font-weight="normal" fill="#1d1d1b">ko&#x27;kalamzorlashtirish → maysa → sozlash (L-17 varaq).</text></g></g><g ><rect x="230" y="237" width="185" height="55" fill="#fff" stroke="#1d1d1b" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke-width="0.4" stroke="#1d1d1b"/><text x="231" y="265.6" font-size="2.3" text-anchor="start" font-weight="bold" fill="#1d1d1b">Lavozim</text><text x="251" y="265.6" font-size="2.3" text-anchor="start" font-weight="bold" fill="#1d1d1b">F.I.Sh.</text><text x="271" y="265.6" font-size="2.3" text-anchor="start" font-weight="bold" fill="#1d1d1b">Imzo</text><text x="283" y="265.6" font-size="2.3" text-anchor="start" font-weight="bold" fill="#1d1d1b">Sana</text><line x1="230" y1="267" x2="295" y2="267" stroke-width="0.2" stroke="#1d1d1b"/><text x="231" y="270.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#1d1d1b">Bosh muhandis</text><text x="251" y="270.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#1d1d1b"></text><text x="271" y="270.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#1d1d1b"></text><text x="283" y="270.6" font-size="2.3" text-anchor="start" font-weight="normal" fill="#1d1d1b">10.26</text><line x1="230" y1="272" x2="295"
